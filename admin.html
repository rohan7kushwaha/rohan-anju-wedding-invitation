<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Wedding Wishes Admin</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Georgia, "Times New Roman", serif;
      color: #292421;
      background: #fbf8f2;
    }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 2rem 1rem; }
    main { width: min(100%, 1100px); margin: 0 auto; padding: clamp(1.2rem, 4vw, 2.5rem); border: 1px solid #e8dfd3; border-radius: 1rem; background: #fffefa; box-shadow: 0 14px 40px rgb(52 34 25 / 8%); }
    h1 { margin: 0 0 0.35rem; color: #642b3b; font-size: clamp(1.7rem, 4vw, 2.4rem); font-weight: 400; }
    .note, #status { color: #766d66; line-height: 1.5; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 0.7rem; margin: 1.4rem 0 0.6rem; }
    button { min-height: 2.6rem; padding: 0.6rem 1rem; border: 1px solid #c59b57; border-radius: 999px; background: #642b3b; color: #fffaf0; cursor: pointer; font: inherit; }
    button:hover { background: #4b202d; }
    button:focus-visible { outline: 3px solid #d9b976; outline-offset: 3px; }
    .table-wrap { overflow-x: auto; border: 1px solid #e8dfd3; border-radius: 0.6rem; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th, td { padding: 0.75rem; border-bottom: 1px solid #e8dfd3; vertical-align: top; }
    th { background: #f7f2e9; color: #642b3b; white-space: nowrap; }
    td { overflow-wrap: anywhere; }
    tbody tr:last-child td { border-bottom: 0; }
    @media (max-width: 600px) {
      body { padding: 0.8rem; }
      th, td { padding: 0.55rem; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Saved wedding wishes</h1>
    <p class="note">Admin access is limited to this server's local network. Keep this page and its password private.</p>
    <div class="toolbar">
      <button id="refreshWishes" type="button">Refresh wishes</button>
      <button id="exportWishes" type="button">Export CSV</button>
    </div>
    <p id="status" role="status" aria-live="polite">Loading wishes…</p>
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>Date</th><th>Name</th><th>City</th><th>Wish</th></tr>
        </thead>
        <tbody id="wishRows"></tbody>
      </table>
    </div>
  </main>
  <script>
    const status = document.getElementById('status');
    const wishRows = document.getElementById('wishRows');
    let wishes = [];

    async function refreshWishes() {
      status.textContent = 'Loading wishes…';
      try {
        const response = await fetch('/api/admin/wishes', {
          cache: 'no-store',
          headers: { 'X-Admin-Request': '1' }
        });
        if (!response.ok) throw new Error(`Request failed with status ${response.status}.`);
        const result = await response.json();
        if (!Array.isArray(result.wishes)) throw new Error('The server returned an invalid wishes list.');

        wishes = result.wishes;
        wishRows.replaceChildren();
        wishes.forEach(wish => {
          const row = document.createElement('tr');
          const date = new Date(wish.created_at).toLocaleString();
          [date, wish.name, wish.city, wish.message].forEach(value => {
            const cell = document.createElement('td');
            cell.textContent = value || '';
            row.appendChild(cell);
          });
          wishRows.appendChild(row);
        });
        status.textContent = wishes.length === 1 ? '1 wish saved.' : `${wishes.length} wishes saved.`;
      } catch (error) {
        status.textContent = 'Could not load wishes. Check the server connection and admin sign-in.';
        console.error('Unable to load wedding wishes.', error);
      }
    }

    function exportWishes() {
      if (wishes.length === 0) {
        status.textContent = 'There are no wishes to export yet.';
        return;
      }

      const csvCell = value => {
        const text = String(value || '');
        const safeText = /^[=+\-@\t\r]/.test(text) ? `'${text}` : text;
        return `"${safeText.replace(/"/g, '""')}"`;
      };
      const rows = [
        ['Date', 'Name', 'City', 'Wish'],
        ...wishes.map(wish => [wish.created_at, wish.name, wish.city, wish.message])
      ];
      const csv = rows.map(row => row.map(csvCell).join(',')).join('\r\n');
      const url = URL.createObjectURL(new Blob(['\ufeff', csv], { type: 'text/csv;charset=utf-8' }));
      const link = document.createElement('a');
      link.href = url;
      link.download = 'rohan-and-anju-wedding-wishes.csv';
      link.click();
      window.setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    document.getElementById('refreshWishes').addEventListener('click', refreshWishes);
    document.getElementById('exportWishes').addEventListener('click', exportWishes);
    refreshWishes();
  </script>
</body>
</html>
